# Plan Vivant : l'application + Caddy (HTTPS automatique via Let's Encrypt).
# Démarrage : docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - TRUST_PROXY=1
    volumes:
      - app_data:/data
    expose:
      - "3000"
    depends_on:
      - convertisseur

  # Conversion des plans DWG (onglet « Plans ») : service interne, jamais exposé
  convertisseur:
    build: ./converter
    restart: unless-stopped
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  app_data:
  caddy_data:
  caddy_config:
