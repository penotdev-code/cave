<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout : écran partagé — plan à gauche, tableau type tableur à droite, en-tête d'une seule ligne. */
:root{
  --bg:#EEF1F4; --sheet:#FFFFFF; --ink:#142030; --muted:#5A6676; --rule:#D5DCE3; --rule-strong:#A3AEBA; --row-alt:#F7F9FA;
  --accent:#1F4FD1; --accent-soft:#E4EAFB; --accent-ink:#FFFFFF;
  --signal:#D25A1C; --ok:#1E7A55; --warn:#A86A00; --bad:#C0261F;
  --st-loue:#BFE3D1; --st-vacant:#FBE3D6; --st-preavis:#F7D98C; --st-nr:#FFFFFF;
  --dpe-a:#009C6D; --dpe-b:#52B153; --dpe-c:#A5CC74; --dpe-d:#F4E70F; --dpe-e:#F0B50F; --dpe-f:#EB8235; --dpe-g:#D7221F; --dpe-none:#E1E5EA;
  --wall:#142030; --hall:#F3F1E4;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E141B; --sheet:#16202A; --ink:#E3E8EE; --muted:#97A3B0; --rule:#2A3541; --rule-strong:#4A5767; --row-alt:#19242F;
  --accent:#86A2FF; --accent-soft:#1D2947; --accent-ink:#0E141B; --signal:#FF8E52; --ok:#5CCB9B; --warn:#F2B84B; --bad:#FF7B72;
  --st-loue:#285E49; --st-vacant:#6A3A27; --st-preavis:#77612A; --st-nr:#16202A;
  --dpe-none:#2E3945; --wall:#C9D2DC; --hall:#22261F; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E141B; --sheet:#16202A; --ink:#E3E8EE; --muted:#97A3B0; --rule:#2A3541; --rule-strong:#4A5767; --row-alt:#19242F;
  --accent:#86A2FF; --accent-soft:#1D2947; --accent-ink:#0E141B; --signal:#FF8E52; --ok:#5CCB9B; --warn:#F2B84B; --bad:#FF7B72;
  --st-loue:#285E49; --st-vacant:#6A3A27; --st-preavis:#77612A; --st-nr:#16202A;
  --dpe-none:#2E3945; --wall:#C9D2DC; --hall:#22261F; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.45; padding-inline:16px}
button,select,input,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:.82rem}
.logo{font-family:var(--f-display); font-weight:800; font-size:1.4rem; letter-spacing:-.01em}
.btn{font-size:.88rem; font-weight:600; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); border-radius:7px; padding:7px 14px; cursor:pointer; white-space:nowrap}
.btn:disabled{opacity:.5; cursor:not-allowed}
.link{border:0; background:none; color:var(--accent); cursor:pointer; padding:4px 2px; font-size:.88rem; text-decoration:underline; text-underline-offset:3px; text-decoration-color:color-mix(in srgb, var(--accent) 40%, transparent)}

/* ---------- en-tête ---------- */
.app{display:flex; flex-direction:column; height:100%; max-width:1680px; margin-inline:auto}
.top{display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px; padding-block:12px 6px}
.brand{display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; margin-right:auto}
.brand span{font-size:.85rem; color:var(--muted)}
.search input{width:220px; max-width:100%; border:1px solid var(--rule-strong); border-radius:7px; padding:7px 11px; background:var(--sheet)}
.actions{display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap}
.sync{font-size:.8rem; color:var(--muted); display:inline-flex; gap:6px; align-items:center; min-width:96px; justify-content:flex-end}
.sync::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--rule-strong)}
.sync[data-s="ok"]::before{background:var(--ok)} .sync[data-s="busy"]::before{background:var(--warn)} .sync[data-s="ro"]::before{background:var(--accent)} .sync[data-s="err"]::before{background:var(--bad)}
.who{font-size:.85rem; color:var(--muted)}
.hint{margin:0 0 10px; font-size:.86rem; color:var(--muted)}

/* ---------- écran partagé ---------- */
.split{flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr); gap:14px; padding-bottom:16px}
.pane{background:var(--sheet); border:1px solid var(--rule); border-radius:10px; display:flex; flex-direction:column; min-height:0; min-width:0; overflow:hidden}
.pane-bar{display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; justify-content:space-between; padding:10px 12px; border-bottom:1px solid var(--rule)}
@media (max-width:1100px){
  .app{height:auto} .split{grid-template-columns:minmax(0,1fr)} .table-box{max-height:none}
  .plan-pane{position:sticky; top:0; z-index:3; max-height:58vh}
}

.tabs{display:flex; gap:4px; flex-wrap:wrap}
.tabs button{border:1px solid transparent; background:none; border-radius:7px; padding:6px 12px; cursor:pointer; color:var(--muted); font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--ink); color:var(--sheet)}
.tabs button:hover:not([aria-pressed="true"]){border-color:var(--rule)}
.seg{display:inline-flex; align-items:center; gap:0; border:1px solid var(--rule-strong); border-radius:7px; overflow:hidden}
.row-ctl{display:flex; align-items:center; gap:8px}
.seg-label{font-size:.8rem; color:var(--muted)}
.seg button:first-child{border-left:0}
.seg button{border:0; border-left:1px solid var(--rule); background:var(--sheet); padding:5px 11px; cursor:pointer; font-size:.86rem}
.seg button[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent); font-weight:600}
.seg.small button{font-size:.8rem; padding:4px 9px}
.seg.small button:first-child{border-left:0}
.chk{display:inline-flex; gap:6px; align-items:center; font-size:.86rem; cursor:pointer}
.chk input{accent-color:var(--accent); width:16px; height:16px}
.count{font-size:.86rem; color:var(--muted)}

/* ---------- plan ---------- */
.plan-box{flex:1; min-height:0; padding:10px; display:flex; align-items:center; justify-content:center}
#plan{width:100%; height:100%; max-height:100%; display:block}
@media (max-width:1100px){ #plan{height:auto; max-height:44vh} }
#plan .lot{cursor:pointer}
#plan .lot:focus{outline:none}
#plan .base{transition:fill .2s}
#plan .outline{fill:none; stroke:var(--wall); stroke-width:2}
#plan .lot.hover .outline{stroke:var(--accent); stroke-width:4}
#plan .lot.is-sel .outline, #plan .lot:focus-visible .outline{stroke:var(--accent); stroke-width:6}
#plan .lot.dim{opacity:.2}
#plan .p-label{font-family:var(--f-mono); font-size:16px; letter-spacing:3px; fill:var(--muted)}
#plan .p-hall{fill:var(--hall); stroke:var(--wall); stroke-width:1.5}
#plan .p-wall{stroke:var(--wall); stroke-width:1.3; pointer-events:none}
#plan .p-room{font-size:16px; font-style:italic; fill:var(--muted); pointer-events:none; font-family:var(--f-body)}
#plan .p-tag{fill:var(--sheet); stroke:var(--wall); stroke-width:1.3; pointer-events:none}
#plan .p-num{font-family:var(--f-body); font-size:19px; font-weight:600; fill:var(--ink); pointer-events:none}
#plan .p-extra{font-family:var(--f-mono); font-size:11px; fill:var(--muted); pointer-events:none}
#plan .p-badge{fill:var(--accent)}
#plan .p-badge-t{font-family:var(--f-body); font-size:13px; font-weight:600; fill:var(--accent-ink)}
#plan .p-warn{fill:var(--bad); stroke:var(--sheet); stroke-width:1.5}
#plan .p-warn-t{font-family:var(--f-display); font-size:13px; font-weight:800; fill:#fff}

.legend{display:flex; flex-wrap:wrap; gap:6px; padding:10px 12px; border-top:1px solid var(--rule)}
.chip{display:inline-flex; align-items:center; gap:7px; border:1px solid var(--rule); background:var(--sheet); border-radius:99px; padding:4px 11px 4px 8px; font-size:.84rem; cursor:pointer}
.chip b{font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--rule-strong)}
.chip[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.chip.clear{color:var(--accent); padding-left:11px}
.sw{width:14px; height:14px; border-radius:4px; border:1px solid var(--rule-strong); display:inline-block}
.sw-hatch{background:repeating-linear-gradient(45deg,var(--signal) 0 3px,transparent 3px 7px)}
.sw-warn{width:15px; height:14px; background:var(--bad); color:#fff; clip-path:polygon(50% 0,100% 100%,0 100%); font-size:9px; font-weight:800; display:inline-grid; place-items:end center; padding-bottom:1px}

/* ---------- tableau ---------- */
.table-box{flex:1; min-height:0; overflow:auto}
.sheet{border-collapse:separate; border-spacing:0; width:100%; font-size:.9rem}
.sheet thead th{position:sticky; top:0; z-index:2; background:var(--bg); text-align:left; font-weight:600; font-size:.76rem; color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--rule-strong); white-space:nowrap}
.sheet td, .sheet tbody th{padding:5px 8px; border-bottom:1px solid var(--rule); vertical-align:middle; white-space:nowrap; text-align:left; font-weight:400}
.sheet tbody tr.row:nth-of-type(even) td, .sheet tbody tr.row:nth-of-type(even) th{background:var(--row-alt)}
.sheet tbody tr.row{cursor:pointer}
.sheet tbody tr.hover td, .sheet tbody tr.hover th{background:var(--accent-soft)!important}
.sheet tbody tr.is-sel td, .sheet tbody tr.is-sel th{background:var(--accent-soft)!important}
.sheet tbody tr.is-sel th{box-shadow:inset 4px 0 0 var(--accent)}
.sheet tbody th .num{font-family:var(--f-display); font-weight:700; font-size:1.02rem}
.sheet tbody th .sub{display:block; font-size:.76rem; color:var(--muted); line-height:1.2}
.warn{display:inline-grid; place-items:center; width:17px; height:17px; margin-left:6px; border-radius:50%; background:var(--bad); color:#fff; font-size:.72rem; font-weight:800; vertical-align:2px; cursor:help}
.flash td, .flash th{animation:flash 1.4s ease-out}
@keyframes flash{0%{background:color-mix(in srgb,var(--accent) 35%,transparent)}100%{}}
@media (prefers-reduced-motion: reduce){ .flash td, .flash th{animation:none} #plan .base{transition:none} }

.sheet select, .sheet input[type="date"], .sheet input[type="text"]{border:1px solid transparent; border-radius:6px; padding:4px 6px; background:transparent; font-size:.88rem; cursor:pointer}
.sheet select:hover, .sheet input:hover{border-color:var(--rule-strong)}
.sheet select:focus, .sheet input:focus{border-color:var(--accent); outline:none; box-shadow:0 0 0 2px var(--accent-soft)}
.in-occ{min-width:112px; color:var(--ink); font-weight:600}
.in-dpe{width:54px; font-family:var(--f-display); font-weight:800; color:#111!important}
.in-dpe.g{color:#fff!important}
.sheet input[type="date"]{width:122px; background:transparent}
.in-fin{width:100px; cursor:text!important; border-color:var(--rule)!important}
.trv{display:inline-flex; align-items:center; cursor:pointer; margin-right:6px; padding:4px}
.c-dpe{display:inline-flex; align-items:center; gap:4px}
.trv input{accent-color:var(--signal); width:17px; height:17px}
.trv span{color:var(--muted); font-size:.84rem}
.pill{display:inline-block; padding:2px 10px; border-radius:99px; font-weight:600; font-size:.84rem; border:1px solid var(--rule)}
.dpe{display:inline-grid; place-items:center; min-width:24px; height:20px; padding:0 4px; border-radius:4px; font-family:var(--f-display); font-weight:800; font-size:.82rem; color:#111}
.dpe.g{color:#fff}

.cm{display:inline-flex; align-items:center; gap:8px; border:1px solid transparent; background:none; border-radius:6px; padding:3px 6px; cursor:pointer; max-width:150px; text-align:left}
.cm:hover, .cm.open{border-color:var(--rule-strong); background:var(--sheet)}
.bubble{flex:none; display:inline-grid; place-items:center; min-width:22px; height:22px; padding:0 6px; border-radius:11px; border:1px dashed var(--rule-strong); color:var(--muted); font-size:.8rem; font-weight:600}
.bubble.on{background:var(--accent); border:0; color:var(--accent-ink)}
.cm-last{max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); font-size:.84rem}

.sheet tr.detail td{background:var(--bg)!important; white-space:normal; padding:10px 14px 14px}
.thread{display:flex; flex-direction:column; gap:8px; max-width:640px}
.ids{margin:0; font-family:var(--f-mono); font-size:.76rem}
.msg{background:var(--sheet); border:1px solid var(--rule); border-radius:8px; padding:7px 11px; font-size:.88rem; overflow-wrap:anywhere}
.msg .meta{font-size:.76rem; color:var(--muted); margin-bottom:2px}
.tag-int{color:var(--warn); font-weight:600}
.compose{display:flex; flex-direction:column; gap:8px}
.compose textarea{width:100%; border:1px solid var(--rule-strong); border-radius:8px; padding:7px 10px; background:var(--sheet); resize:vertical; font-size:.9rem}
.compose-bar{display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; align-items:center}
.empty{padding:20px 12px!important; white-space:normal!important}

/* ---------- historique ---------- */
.overlay{position:fixed; inset:0; background:rgba(10,16,24,.45); display:grid; place-items:center; padding:16px; z-index:10}
.dialog{background:var(--sheet); border-radius:12px; width:min(680px,100%); max-height:80vh; display:flex; flex-direction:column; overflow:hidden; border:1px solid var(--rule)}
.dialog-head{display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-bottom:1px solid var(--rule)}
.dialog-head h2{margin:0; font-family:var(--f-display); font-size:1.15rem}
.history{list-style:none; margin:0; padding:12px 18px; overflow:auto; display:flex; flex-direction:column; gap:8px; font-size:.88rem}
.history li{display:grid; grid-template-columns:150px minmax(0,1fr); gap:10px}
@media (max-width:600px){ .history li{grid-template-columns:minmax(0,1fr)} }

/* ---------- connexion ---------- */
.login{min-height:100%; display:grid; place-items:center; padding-block:24px}
.login-card{width:100%; max-width:360px; padding:26px; display:flex; flex-direction:column; gap:14px; background:var(--sheet); border:1px solid var(--rule); border-radius:12px}
.field{display:flex; flex-direction:column; gap:5px; font-size:.84rem; color:var(--muted)}
.field input{font-size:1rem; padding:8px 10px; border:1px solid var(--rule-strong); border-radius:7px; background:var(--sheet); color:var(--ink)}
.login-card .btn{padding:9px 14px}
.login-err{margin:0; color:var(--bad); font-size:.88rem}
.login-card p{margin:0}

.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); background:var(--ink); color:var(--sheet); padding:9px 15px; border-radius:8px; font-size:.88rem; z-index:20; max-width:calc(100% - 32px)}
@media (min-width:1101px) and (max-width:1400px){ .cm-last{display:none} .sheet td, .sheet tbody th{padding-inline:6px} }
</style>



<div class="app" id="app" hidden>
  <header class="top">
    <div class="brand"><b class="logo">Plan Vivant</b><span id="building"></span></div>
    <form class="search" id="searchform" role="search">
      <input id="q" type="search" placeholder="Aller au lot… (ex. 623)" autocomplete="off" aria-label="Rechercher un lot">
    </form>
    <div class="actions">
      <span class="sync" id="sync" data-s=""></span>
      <button type="button" class="btn" id="export">Exporter Excel</button>
      <button type="button" class="link" id="history-btn">Historique</button>
      <span class="who" id="who"></span>
      <button type="button" class="link" id="logout" hidden>Déconnexion</button>
    </div>
  </header>

  <p class="hint" id="hint"></p>

  <main class="split">
    <section class="pane plan-pane" id="plan-pane" aria-label="Plan">
      <div class="pane-bar">
        <div class="tabs" id="levels" role="group" aria-label="Niveau"></div>
        <div class="row-ctl"><span class="seg-label">Colorer selon</span>
        <div class="seg" role="group" aria-label="Colorer les lots selon">
          <button type="button" data-color="occ" aria-pressed="true">Occupation</button>
          <button type="button" data-color="dpe" aria-pressed="false">DPE</button>
        </div></div>
      </div>
      <div class="plan-box"><svg id="plan" role="img" aria-label="Plan"></svg></div>
      <div class="legend" id="legend" aria-label="Légende, cliquer pour filtrer"></div>
    </section>

    <section class="pane table-pane" id="table-pane" aria-label="Tableau des lots">
      <div class="pane-bar">
        <span class="count" id="count"></span>
        <label class="chk"><input type="checkbox" id="all"> Tous les niveaux</label>
      </div>
      <div class="table-box">
        <table class="sheet">
          <thead><tr>
            <th scope="col">Lot</th><th scope="col" id="col-level" hidden>Niveau</th>
            <th scope="col">Occupation</th><th scope="col">Travaux</th><th scope="col">DPE · date</th><th scope="col">Commentaires</th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<div class="overlay" id="history" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="history-title">
    <div class="dialog-head"><h2 id="history-title">Historique des modifications</h2><button type="button" class="link" id="history-close">Fermer</button></div>
    <ul class="history" id="history-list"></ul>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

/* Plan Vivant — interface : le plan à gauche, le tableau à droite, toujours synchronisés.

const PV = (() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];

  const EMPTY = { occ: 'nr', travaux: false, fin: '', dpe: '', dpeDate: '' };
  const isLogement = l => /^T\d/.test(l.type);
  function alerts(l, s) {
    const a = [];

    if (s.dpe === 'G') a.push('Classe G : location interdite depuis 2025');
    if (s.dpe === 'F') a.push('Classe F : location interdite en 2028');

    const T = id => ({ ...EMPTY, ...(S.lots[id] || {}) });
    const cmts = id => S.comments.filter(c => c.lot === id);

    $('#building').textContent = PLAN.immeuble || '';

    $('#history-btn').hidden = !S.canInternal;

      ? 'Cliquez un lot sur le plan ou une ligne du tableau. Modifiez directement dans le tableau : tout est enregistré aussitôt.'

    /* ===================== PLAN ===================== */
    const svg = $('#plan');
    function drawLevel() {
      const L = S.level;

        const lt = el('text', { x: tx, y: ty + 6, 'text-anchor': 'middle', class: 'p-num' }, G); lt.textContent = g.lot;
        if (g.extra) { const e = el('text', { x: tx, y: ty + r + 18, 'text-anchor': 'middle', class: 'p-extra' }, G); e.textContent = g.extra; }
        l.badge = el('g', { transform: `translate(${tx + r + 4} ${ty - r - 2})`, 'pointer-events': 'none' }, G);
        el('circle', { r: 11, class: 'p-badge' }, l.badge);
        l.badgeT = el('text', { y: 4.5, 'text-anchor': 'middle', class: 'p-badge-t' }, l.badge);
        l.warn = el('g', { transform: `translate(${tx - r - 4} ${ty - r - 2})`, 'pointer-events': 'none' }, G);
        el('path', { d: 'M0 -12 L12 9 L-12 9 Z', class: 'p-warn' }, l.warn);
        const wt = el('text', { y: 6, 'text-anchor': 'middle', class: 'p-warn-t' }, l.warn); wt.textContent = '!';
        G.addEventListener('click', () => select(l, 'plan'));
        G.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(l, 'plan'); } });
        G.addEventListener('mouseenter', () => hover(l.id, true));
        G.addEventListener('mouseleave', () => hover(l.id, false));
      });
      $$('#levels button').forEach(b => b.setAttribute('aria-pressed', b.dataset.level === L.id));
    }
    const matches = l => {
      if (!S.filter) return true;
      const s = T(l.id);
      if (S.filter === 'travaux') return s.travaux;
      if (S.filter === 'alertes') return alerts(l, s).length > 0;
      if (S.filter.startsWith('dpe:')) return s.dpe === S.filter.slice(4);
      return s.occ === S.filter;
    };
    function paintPlan() {
      S.level.lots.forEach(g => {
        const l = byId[g.lot], s = T(l.id);
        l.base.setAttribute('fill', S.color === 'occ' ? OCCV[s.occ] : DPEV[s.dpe]);
        l.hatch.style.display = s.travaux ? '' : 'none';
        const n = cmts(l.id).length;
        l.badge.style.display = n ? '' : 'none'; l.badgeT.textContent = n;
        l.warn.style.display = alerts(l, s).length ? '' : 'none';
        const G = l.base.parentNode;
        G.classList.toggle('is-sel', S.sel === l);
        G.classList.toggle('dim', !matches(l));
      });
    }

    /* ===================== LÉGENDE = FILTRES ===================== */
    function renderLegend() {
      const pool = S.all ? LOTS : LOTS.filter(l => l.level === S.level);
      const count = f => pool.filter(l => { const s = T(l.id); return f(l, s); }).length;
      let chips;
      if (S.color === 'occ') chips = Object.keys(OCC).map(k => [k, OCC[k], `<span class="sw" style="background:${OCCV[k]}"></span>`, count((l, s) => s.occ === k)]);
      else chips = DPE.concat('').map(k => ['dpe:' + k, k || 'Sans DPE', `<span class="sw" style="background:${DPEV[k]}"></span>`, count((l, s) => s.dpe === k)]);
      chips.push(['travaux', 'En travaux', '<span class="sw sw-hatch"></span>', count((l, s) => s.travaux)]);

      $('#legend').innerHTML = chips.filter(c => c[3] || S.filter === c[0]).map(([k, lab, sw, n]) =>

      $$('#legend .chip').forEach(b => b.addEventListener('click', () => { S.filter = b.dataset.f && S.filter !== b.dataset.f ? b.dataset.f : null; refresh(); }));
    }

    /* ===================== TABLEAU ===================== */

    const ro = () => !S.canWrite;
    function rowHtml(l) {

      const occCell = ro() ? `<span class="pill" style="background:${OCCV[s.occ]}">${OCC[s.occ]}</span>`
        : `<select class="in-occ" data-k="occ" aria-label="Occupation du lot ${l.id}" style="background:${OCCV[s.occ]}">${Object.entries(OCC).map(([k, v]) => `<option value="${k}" ${k === s.occ ? 'selected' : ''}>${v}</option>`).join('')}</select>`;
      const trvCell = ro() ? (s.travaux ? `Oui${s.fin ? ' · ' + esc(s.fin) : ''}` : '<span class="muted">—</span>')
        : `<label class="trv"><input type="checkbox" data-k="travaux" ${s.travaux ? 'checked' : ''} aria-label="Travaux en cours, lot ${l.id}"></label>${s.travaux ? `<input type="text" class="in-fin" data-k="fin" value="${esc(s.fin)}" placeholder="fin prévue" aria-label="Fin prévue des travaux">` : ''}`;
      const dpeCell = ro() ? `<span class="dpe ${s.dpe === 'G' ? 'g' : ''}" style="background:${DPEV[s.dpe]}">${s.dpe || '—'}</span>`
        : `<select class="in-dpe ${s.dpe === 'G' ? 'g' : ''}" data-k="dpe" aria-label="Classe DPE du lot ${l.id}" style="background:${DPEV[s.dpe]}"><option value="">—</option>${DPE.map(k => `<option ${k === s.dpe ? 'selected' : ''}>${k}</option>`).join('')}</select>`;
      const dateCell = ro() || !s.dpe ? (fmtDate(s.dpeDate) ? `<span class="muted">${fmtDate(s.dpeDate)}</span>` : '') : `<input type="date" data-k="dpeDate" value="${esc(s.dpeDate)}" aria-label="Date du DPE">`;
      return `<tr class="row ${S.sel === l ? 'is-sel' : ''}" data-lot="${l.id}">
        <th scope="row"><span class="num">${l.id}</span>${al.length ? `<span class="warn" title="${esc(al.join(' · '))}">!</span>` : ''}<span class="sub">${[l.type, l.surf ? m2(l.surf) + ' m²' : ''].filter(Boolean).join(' · ') || '&nbsp;'}</span></th>
        ${S.all ? `<td>${esc(l.level.name)}</td>` : ''}
        <td>${occCell}</td><td class="c-trv">${trvCell}</td><td><span class="c-dpe">${dpeCell}${dateCell}</span></td>
        <td><button type="button" class="cm ${S.open === l.id ? 'open' : ''}" data-act="cm" aria-expanded="${S.open === l.id}">
          <span class="bubble ${n ? 'on' : ''}">${n || '+'}</span><span class="cm-last">${last ? esc(last.txt) : (S.canWrite ? 'Ajouter' : '')}</span></button></td>
      </tr>${S.open === l.id ? detailHtml(l) : ''}`;
    }
    function detailHtml(l) {
      const list = cmts(l.id), d = S.drafts[l.id] || { txt: '', vis: S.canInternal ? 'int' : 'sh' };
      return `<tr class="detail" data-lot="${l.id}"><td colspan="${S.all ? 6 : 5}"><div class="thread">
        ${l.locaux.length ? `<p class="ids">${l.locaux.map(x => `${esc(x[0])} <span class="muted">(${esc(x[1])}${x[2] != null ? ', ' + m2(x[2]) + ' m²' : ''})</span>`).join(' · ')}</p>` : ''}
        ${list.length ? list.map(c => `<div class="msg"><div class="meta"><b>${esc(c.auteur || 'Quelqu’un')}</b> · ${fmtStamp(c.at)}${c.vis === 'int' ? ' · <span class="tag-int">interne</span>' : ''}</div>${esc(c.txt)}</div>`).join('') : '<p class="muted">Pas encore de commentaire.</p>'}
        ${S.canWrite ? `<div class="compose">

            <button type="button" class="btn" data-act="send">Ajouter</button>
          </div></div>` : ''}
      </div></td></tr>`;
    }
    function lotsShown() { return (S.all ? LOTS : LOTS.filter(l => l.level === S.level)).filter(matches).sort((a, b) => (S.all ? LEVELS.indexOf(a.level) - LEVELS.indexOf(b.level) : 0) || a.id - b.id); }
    function renderTable() {
      $('#col-level').hidden = !S.all;
      const act = document.activeElement, keep = act && tbody.contains(act) && act.closest('tr');
      // si l'on est en train d'écrire dans une ligne, on ne la redessine pas
      if (keep && (act.tagName === 'TEXTAREA' || act.type === 'text' || act.type === 'date')) {
        $$('tr.row', tbody).forEach(tr => { if (tr !== keep && !tr.contains(act)) { const l = byId[tr.dataset.lot]; if (l) tr.classList.toggle('is-sel', S.sel === l); } });
        return;
      }
      const rows = lotsShown();
      tbody.innerHTML = rows.map(rowHtml).join('') || `<tr><td colspan="8" class="muted empty">Aucun lot ne correspond. <button type="button" class="link" data-act="clear">Tout afficher</button></td></tr>`;
      $('#count').textContent = `${rows.length} lot${rows.length > 1 ? 's' : ''}`;
    }

    // délégation d'événements sur le tableau
    tbody.addEventListener('change', e => {
      const t = e.target, tr = t.closest('tr'), k = t.dataset.k; if (!tr || !k || k === 'draft') return;
      const l = byId[tr.dataset.lot], s = T(l.id);
      const next = { ...s, [k]: t.type === 'checkbox' ? t.checked : t.value.trim() };
      if (k === 'travaux' && !t.checked) next.fin = '';
      save(l, next);
      if (k === 'travaux' && t.checked) setTimeout(() => $(`tr.row[data-lot="${l.id}"] .in-fin`)?.focus(), 0);
    });
    tbody.addEventListener('input', e => { const t = e.target; if (t.dataset.k === 'draft') { const id = t.closest('tr').dataset.lot; S.drafts[id] = { ...(S.drafts[id] || { vis: S.canInternal ? 'int' : 'sh' }), txt: t.value }; } });
    tbody.addEventListener('click', e => {
      const t = e.target, tr = t.closest('tr'); if (!tr) return;
      if (t.closest('[data-act="clear"]')) { S.filter = null; refresh(); return; }
      const l = byId[tr.dataset.lot]; if (!l) return;
      const vis = t.closest('[data-vis]');
      if (vis) { S.drafts[l.id] = { ...(S.drafts[l.id] || { txt: '' }), vis: vis.dataset.vis }; $$('[data-vis]', tr).forEach(b => b.setAttribute('aria-pressed', b === vis)); return; }
      if (t.closest('[data-act="send"]')) { send(l); return; }
      if (t.closest('[data-act="cm"]')) { S.open = S.open === l.id ? null : l.id; select(l, 'table'); if (S.open) setTimeout(() => $(`tr.detail[data-lot="${l.id}"] textarea`)?.focus(), 0); return; }
      if (tr.classList.contains('row') && !t.closest('select,input,label,button')) select(l, 'table');
    });
    tbody.addEventListener('focusin', e => { const tr = e.target.closest('tr.row'); if (tr && S.sel !== byId[tr.dataset.lot]) { S.sel = byId[tr.dataset.lot]; paintPlan(); $$('tr.row', tbody).forEach(r => r.classList.toggle('is-sel', r === tr)); } });
    tbody.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.dataset.k === 'draft') send(byId[e.target.closest('tr').dataset.lot]); });
    tbody.addEventListener('mouseover', e => { const tr = e.target.closest('tr'); if (tr) hover(tr.dataset.lot, true); });
    tbody.addEventListener('mouseout', e => { const tr = e.target.closest('tr'); if (tr && !tr.contains(e.relatedTarget)) hover(tr.dataset.lot, false); });

    function hover(id, on) {
      const l = byId[id]; if (!l) return;
      if (l.base && l.level === S.level) l.base.parentNode.classList.toggle('hover', on);
      $$(`#tbody tr[data-lot="${id}"]`).forEach(tr => tr.classList.toggle('hover', on));
    }
    function select(l, from) {
      if (!l) return;
      S.sel = l;
      if (l.level !== S.level && !S.all) { S.level = l.level; drawLevel(); }
      else if (l.level !== S.level) { S.level = l.level; drawLevel(); }
      if (!matches(l)) S.filter = null;
      refresh();
      const tr = $(`#tbody tr.row[data-lot="${l.id}"]`);
      if (tr && from !== 'table') {
        tr.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
        tr.classList.remove('flash'); void tr.offsetWidth; tr.classList.add('flash');
        if (innerWidth < 1100) $('#table-pane').scrollIntoView({ block: 'start', behavior: 'smooth' });
      }
      if (from === 'table' && innerWidth < 1100) $('#plan-pane').scrollIntoView({ block: 'start', behavior: 'smooth' });
    }

    /* ===================== ÉCRITURES ===================== */
    const setSync = (s, txt) => { const e = $('#sync'); e.dataset.s = s; e.textContent = txt; };
    let chain = Promise.resolve();
    const queue = fn => (chain = chain.then(fn, fn));
    function save(l, next) {
      const body = { occ: next.occ, travaux: !!next.travaux, fin: next.travaux ? next.fin || '' : '', dpe: next.dpe || '', dpeDate: next.dpeDate || '' };
      S.lots[l.id] = { ...(S.lots[l.id] || {}), ...body, maj: new Date().toISOString() };
      refresh();
      queue(async () => {
        setSync('busy', 'Enregistrement…');
        try { await B.saveLot(l.id, body); setSync('ok', 'Enregistré'); } catch (e) { onError(e); }
      });
    }
    function send(l) {
      const d = S.drafts[l.id] || {}, txt = (d.txt || '').trim();
      if (!txt) { $(`tr.detail[data-lot="${l.id}"] textarea`)?.focus(); return; }
      const vis = S.canInternal ? (d.vis || 'int') : 'sh';
      S.comments.push({ lot: l.id, txt, vis, at: new Date().toISOString(), auteur: B.me ? B.me.name : 'Vous' });
      S.drafts[l.id] = { txt: '', vis };
      document.activeElement?.blur();
      refresh();
      queue(async () => {
        setSync('busy', 'Enregistrement…');
        try { await B.addComment(l.id, txt, vis); setSync('ok', 'Enregistré'); } catch (e) { S.drafts[l.id] = { txt, vis }; onError(e); }
      });
    }
    function onError(e) {
      if (e && e.readOnly) { S.canWrite = S.canInternal = false; toast('Votre accès est en consultation : la modification n’a pas été enregistrée.'); refresh(); setSync('ro', 'Consultation'); return; }
      setSync('err', 'Non enregistré');
      toast((e && e.message) || 'La modification n’a pas pu être enregistrée. Vérifiez la connexion puis réessayez.');
      B.reload && B.reload();
    }

    /* ===================== EXPORT EXCEL ===================== */
    function buildWorkbook() {
      const lotsRows = LOTS.slice().sort((a, b) => a.id - b.id).map(l => {
        const s = T(l.id), tr = S.lots[l.id] || {};
        return { 'N° lot': +l.id, 'Locaux (identifiants)': l.locaux.map(x => x[0]).join(' | '), 'Niveaux': l.niveaux, 'Type': l.type, 'Surface m²': l.surf ?? '',
          'Occupation': OCC[s.occ], 'Travaux': s.travaux ? 'Oui' : 'Non', 'Fin travaux prévue': s.fin, 'DPE': s.dpe, 'Date DPE': s.dpeDate ? new Date(s.dpeDate + 'T00:00:00') : '',
          'Alertes': alerts(l, s).join(' / '), 'Nb commentaires': cmts(l.id).length, 'Dernier commentaire': (cmts(l.id).slice(-1)[0] || {}).txt || '', 'Mis à jour': tr.maj ? new Date(tr.maj) : '' };
      });
      const locRows = [];
      LOTS.forEach(l => l.locaux.forEach(x => locRows.push({ 'Identifiant': x[0], 'N° lot': +l.id, 'Niveau': x[1], 'Surface m²': x[2] ?? '' })));
      const cmRows = S.comments.slice().sort((a, b) => a.lot - b.lot || (a.at || '').localeCompare(b.at || '')).map(c => ({ 'N° lot': +c.lot, 'Date': c.at ? new Date(c.at) : '', 'Auteur': c.auteur || '', 'Visible par': c.vis === 'int' ? 'Équipe' : 'Partenaires', 'Commentaire': c.txt }));
      const wb = XLSX.utils.book_new();
      const add = (rows, name, widths) => { const ws = XLSX.utils.json_to_sheet(rows, { cellDates: true, dateNF: 'dd/mm/yyyy' }); ws['!cols'] = widths.map(w => ({ wch: w })); if (rows.length) ws['!autofilter'] = { ref: ws['!ref'] }; XLSX.utils.book_append_sheet(wb, ws, name); };
      add(lotsRows, 'LOTS', [8, 34, 14, 10, 10, 14, 8, 18, 5, 11, 50, 10, 50, 12]);
      add(locRows, 'LOCAUX', [16, 8, 8, 10]);
      add(cmRows, 'COMMENTAIRES', [8, 12, 18, 12, 80]);
      if (S.canInternal) add(S.journal.map(e => ({ 'Date': e.at ? new Date(e.at) : '', 'Auteur': e.auteur || '', 'N° lot': +e.lot, 'Modification': e.txt })), 'HISTORIQUE', [12, 18, 8, 60]);
      return wb;
    }
    $('#export').addEventListener('click', async () => {
      if (!window.XLSX) { toast('Le module Excel n’a pas pu se charger. Rechargez la page.'); return; }
      const d = new Date(), name = `Plan-Vivant_${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.xlsx`;
      const buf = XLSX.write(buildWorkbook(), { bookType: 'xlsx', type: 'array', cellDates: true });
      try { await B.saveFile(name, buf); } catch (e) { if (e && e.message) toast(e.message); }
    });

    /* ===================== HISTORIQUE ===================== */
    const hist = $('#history');
    function renderHistory() {
      $('#history-list').innerHTML = S.journal.length ? S.journal.map(e => `<li><span class="muted">${fmtStamp(e.at)}</span><span><b>${esc(e.auteur || 'Quelqu’un')}</b> · lot ${esc(e.lot)} · ${esc(e.txt)}</span></li>`).join('') : '<li class="muted">Aucune modification pour l’instant.</li>';
    }
    $('#history-btn').addEventListener('click', () => { renderHistory(); hist.hidden = false; $('#history-close').focus(); });
    $('#history-close').addEventListener('click', () => { hist.hidden = true; $('#history-btn').focus(); });
    hist.addEventListener('click', e => { if (e.target === hist) hist.hidden = true; });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !hist.hidden) hist.hidden = true; });

    /* ===================== CONTRÔLES ===================== */
    $('#levels').innerHTML = LEVELS.map(L => `<button type="button" data-level="${L.id}">${esc(L.name)}</button>`).join('');
    $$('#levels button').forEach(b => b.addEventListener('click', () => { S.level = LEVELS.find(L => L.id === b.dataset.level); S.open = null; drawLevel(); refresh(); }));
    $$('[data-color]').forEach(b => b.addEventListener('click', () => { S.color = b.dataset.color; S.filter = null; $$('[data-color]').forEach(o => o.setAttribute('aria-pressed', o === b)); refresh(); }));
    $('#all').addEventListener('change', e => { S.all = e.target.checked; refresh(); });
    $('#searchform').addEventListener('submit', e => {
      e.preventDefault();
      const q = $('#q').value.trim().replace(/\s/g, '').toLowerCase(); if (!q) return;
      const l = byId[q] || LOTS.find(x => q.length > 2 && x.locaux.some(y => y[0].replace(/\s/g, '').toLowerCase().includes(q)));
      if (l) { $('#q').value = ''; select(l, 'search'); } else toast(`Aucun lot « ${$('#q').value.trim()} » sur les plans.`);
    });

    function refresh() { paintPlan(); renderLegend(); renderTable(); if (!hist.hidden) renderHistory(); }

    /* ===================== DONNÉES ===================== */
    setSync(S.canWrite ? 'ok' : 'ro', S.canWrite ? 'À jour' : 'Consultation');
    drawLevel();
    B.subscribe(st => {
      S.lots = st.lots || {}; S.comments = (st.comments || []).slice().sort((a, b) => (a.at || '').localeCompare(b.at || '')); S.journal = st.journal || [];
      if (typeof st.canWrite === 'boolean') { S.canWrite = st.canWrite; S.canInternal = st.canInternal; }
      refresh();
    });
    refresh();
  }
  return { start };
})();


/* Backend de la démo publiée sur claude.ai : base partagée de la page (capability db).
   Collections : lots/{n°}, partages/*, interne/* (équipe), journal/* (équipe). */
(() => {
  const $ = s => document.querySelector(s);
  const PLAN = window.PV_PLAN;
  const OCC = { nr: 'À renseigner', loue: 'Loué', preavis: 'Préavis', vacant: 'Vacant' };
  const local = () => {
    // Hors de claude.ai (fichier ouvert en local) : démo en mémoire, rien n'est enregistré.
    const st = { lots: {}, comments: [], journal: [] };
    let fn = () => {};
    const banner = $('#hint'); setTimeout(() => { banner.textContent = 'Démo locale : les modifications disparaissent au rechargement de la page.'; }, 0);
    return {
      plan: PLAN, me: { name: 'Vous' }, canWrite: true, canInternal: true,
      subscribe(f) { fn = f; f(st); },
      async saveLot(id, b) { st.lots[id] = { ...b, maj: new Date().toISOString() }; st.journal.unshift({ lot: id, txt: 'Lot modifié', at: new Date().toISOString(), auteur: 'Vous' }); },
      async addComment(lot, txt, vis) { st.comments.push({ lot, txt, vis, at: new Date().toISOString(), auteur: 'Vous' }); },
      saveFile(name, buf) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf])); a.download = name; a.click(); },
    };
  };
  async function boot() {
    $('#app').hidden = false;
    if (!window.claude || !window.claude.use) { PV.start(local()); return; }
    const [db, user, dl] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('downloads')]);
    if (!db) { PV.start(local()); return; }
    const me = user ? await user.id() : null;
    const w = user ? await user.can('data.write') : null;
    let canWrite = w !== false;
    const names = {};
    let myName = 'Vous';
    if (user) { try { const v = await user.me(); if (v && v.name) myName = v.name; } catch {} }
    const raw = { lots: {}, sh: [], int: [], journal: [] };
    let listener = () => {}, pend = false;
    const label = x => (x.by && names[x.by]) || x.auteur || 'Quelqu’un';
    const emit = () => {
      if (pend) return; pend = true;
      requestAnimationFrame(() => {
        pend = false;
        listener({
          lots: raw.lots,
          comments: raw.sh.map(c => ({ ...c, vis: 'sh', auteur: label(c) })).concat(raw.int.map(c => ({ ...c, vis: 'int', auteur: label(c) }))),
          journal: raw.journal.map(j => ({ ...j, auteur: label(j) })),
          canWrite, canInternal: canWrite,
        });
        resolveNames();
      });
    };
    async function resolveNames() {
      if (!user) return;
      const ids = [...new Set([...raw.sh, ...raw.int, ...raw.journal].map(x => x.by).filter(id => id && !(id in names)))];
      if (!ids.length) return;
      const ps = await user.profiles(ids);
      ids.forEach(id => { names[id] = (ps[id] && ps[id].name) || ''; });
      emit();
    }
    const writeErr = e => {
      if (e && e.code === 'invalid_argument') { canWrite = false; emit(); throw Object.assign(new Error(''), { readOnly: true }); }
      if (e && e.code === 'quota_exceeded') throw new Error('La base de la démo est pleine : modification non enregistrée.');
      throw new Error('La modification n’a pas pu être enregistrée. Vérifiez la connexion puis réessayez.');
    };
    const ops = {};
    PV.start({
      plan: PLAN, me: { name: myName }, canWrite, canInternal: canWrite,
      subscribe(fn) {
        listener = fn;
        db.collection('lots').onSnapshot(s => { const t = {}; s.docs.forEach(d => t[d.id] = d.data()); raw.lots = t; emit(); });
        db.collection('partages').orderBy('at').limit(1000).onSnapshot(s => { raw.sh = s.docs.map(d => d.data()); emit(); });
        db.collection('interne').orderBy('at').limit(1000).onSnapshot(s => { raw.int = s.docs.map(d => d.data()); emit(); });
        db.collection('journal').orderBy('at', 'desc').limit(300).onSnapshot(s => { raw.journal = s.docs.map(d => d.data()); emit(); });
      },
      async saveLot(id, b) {
        const before = { occ: 'nr', travaux: false, fin: '', dpe: '', dpeDate: '', ...(raw.lots[id] || {}) };
        const now = new Date().toISOString();
        const changes = [];
        if (before.occ !== b.occ) changes.push(`Occupation : ${OCC[before.occ]} → ${OCC[b.occ]}`);
        if (!!before.travaux !== b.travaux) changes.push(`Travaux : ${b.travaux ? 'en cours' : 'terminés'}`);
        if (b.travaux && before.fin !== b.fin) changes.push(`Fin des travaux : ${b.fin || '—'}`);
        if (before.dpe !== b.dpe) changes.push(`DPE : ${before.dpe || '—'} → ${b.dpe || '—'}`);
        if (before.dpeDate !== b.dpeDate) changes.push(`Date DPE : ${b.dpeDate ? b.dpeDate.split('-').reverse().join('/') : '—'}`);
        const prev = ops[id] || Promise.resolve();
        const run = prev.then(async () => {
          try {
            await db.doc('lots/' + id).set({ ...b, maj: now, majBy: me });
            for (const c of changes) await db.collection('journal').add({ lot: id, txt: c, at: now, by: me });
          } catch (e) { writeErr(e); }
        });
        ops[id] = run.catch(() => {});
        return run;
      },
      async addComment(lot, txt, vis) {
        const at = new Date().toISOString();
        try {
          await db.collection(vis === 'int' ? 'interne' : 'partages').add({ lot, txt, at, by: me });
          await db.collection('journal').add({ lot, txt: `Commentaire ${vis === 'int' ? 'équipe' : 'partagé'} ajouté`, at, by: me });
        } catch (e) { writeErr(e); }
      },
      async saveFile(name, buf) {
        if (!dl) throw new Error('L’enregistrement de fichier n’est pas disponible dans cette vue.');
        try { await dl.save({ filename: name, data: new Uint8Array(buf) }); }
        catch (e) { if (e && e.code === 'declined') return; throw new Error(e && e.code === 'rate_limited' ? 'Une demande d’enregistrement est déjà ouverte.' : 'L’enregistrement du fichier n’a pas abouti.'); }
      },
    });
  }
  boot();
})();
</script>
